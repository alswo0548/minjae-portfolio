name: Inspect OCTV and reference demo media
on:
  push:
    branches: [feat/octv-motion-demos-20261108]
    paths:
      - '.github/workflows/octv-media-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media probe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Print source media specifications
        run: |
          for f in assets/01-octv/demo_*.mp4 assets/02-gooddeedquest/*.mp4 assets/03-climbing-web/*.mp4; do
            echo "===== $f ====="
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,avg_frame_rate,nb_frames,bit_rate,codec_name -show_entries format=duration,size,bit_rate -of default=noprint_wrappers=1 "$f"
            echo "EARLY_FRAME_HASHES:"
            ffmpeg -hide_banner -v error -ss 0 -t 3 -i "$f" -vf "fps=1,scale=160:110" -f framemd5 - | tail -4
          done