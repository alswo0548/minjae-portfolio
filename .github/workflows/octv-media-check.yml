name: Improve OCTV demo motion and interaction guides
on:
  push:
    branches:
      - feat/octv-motion-demos-20261108
    paths:
      - '.github/workflows/octv-media-check.yml'

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install video tools and image renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q 'Pillow==11.3.0'
      - name: Verify untouched source and build enhanced footage
        run: |
          set -e
          for f in assets/01-octv/demo_cctv.mp4 assets/01-octv/demo_overview.mp4 assets/01-octv/demo_analysis.mp4 assets/01-octv/demo_routes.mp4; do
            test -s "$f"
          done
          python scripts/improve_octv_guided_demos.py
      - name: Commit only edited demonstration videos and existing HTML
        run: |
          set -e
          git config user.name "alswo0548"
          git config user.email "alswo0548@gmail.com"
          git add assets/01-octv/demo_cctv.mp4 assets/01-octv/demo_overview.mp4 assets/01-octv/demo_analysis.mp4 assets/01-octv/demo_routes.mp4 octv.html
          git rm -f .github/workflows/octv-media-check.yml scripts/improve_octv_guided_demos.py
          test ! -f .github/workflows/octv-media-check.yml
          test ! -f scripts/improve_octv_guided_demos.py
          git diff --cached --stat
          git commit -m "feat: align OCTV demonstrations to 30fps with guided cursor"
          git push origin HEAD:feat/octv-motion-demos-20261108
