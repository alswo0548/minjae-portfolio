name: Create portfolio covers from real project screens
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-covers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install image renderer and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          python -m pip install -q 'Pillow==11.3.0'
      - name: Render three real-screen project cover images
        run: python scripts/build_curated_covers.py
      - name: Verify output and remove one-time build files
        run: |
          test -s assets/portfolio-covers/octv.webp
          test -s assets/portfolio-covers/gooddeedquest.webp
          test -s assets/portfolio-covers/climbing.webp
          git rm -f .github/workflows/one-time-covers.yml scripts/build_curated_covers.py
          git add assets/portfolio-covers
          git config user.name "alswo0548"
          git config user.email "alswo0548@gmail.com"
          git commit -m "assets: add unified project cover images using real captures"
          git push origin HEAD:main
